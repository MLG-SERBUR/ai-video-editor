# Builds the Uno Platform app on real runners and publishes both
# targets to the rolling `latest` release:
#   Windows  -> AiVideoEditor-portable.zip (+ version.txt, the in-app
#               custom updater's check file)
#   Web      -> GitHub Pages deploy (this is the iOS path: open the site
#               in Safari; no App Store, no Mac build, no signing) plus
#               AiVideoEditor-web.zip on the release as a backup.
#
# Jobs run chained (windows -> web) so the two
# `gh release upload --clobber` calls never race each other on the
# same tag. The windows job creates the `latest` prerelease if missing.
#
# Uno 7.0 / .NET 10. The csproj is a single Uno.Sdk project with two
# TFMs (windows, browserwasm); restore touches both, so every job
# installs the wasm-tools workload first. No Android target: dropped
# 2026-11-15, nobody asked for it.

name: Build AiVideoEditor (Uno)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  windows:
    name: Windows portable zip
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install workloads
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
        run: dotnet workload install wasm-tools

      - name: Publish app (unpackaged, self-contained)
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
        run: |
          # No -r here on purpose: a forced RID leaks into every TFM's
          # restore. Uno's WinAppSDK target defaults the RID to
          # win-<host arch> itself when none is given.
          dotnet publish src/AiVideoEditor/AiVideoEditor.csproj -f net10.0-windows10.0.26100 -c Release --self-contained -o publish/app
          $env:GITHUB_SHA | Out-File -FilePath publish/app/version.txt -NoNewline

      - name: Create portable zip
        run: |
          Compress-Archive -Path publish/app/* -DestinationPath AiVideoEditor-portable.zip -Force
          Copy-Item publish/app/version.txt -Destination version.txt

      - name: Upload to latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "latest"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --prerelease `
              --title "AiVideoEditor (latest)" `
              --notes "Latest automated build. Windows: AiVideoEditor-portable.zip. Web: GitHub Pages site (or AiVideoEditor-web.zip)."
          }
          gh release upload $tag AiVideoEditor-portable.zip version.txt --clobber

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: AiVideoEditor-portable
          path: AiVideoEditor-portable.zip

  web:
    name: Web (GitHub Pages)
    needs: windows
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install workloads
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
        run: dotnet workload install wasm-tools

      - name: Publish WebAssembly site
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
        run: |
          dotnet publish src/AiVideoEditor/AiVideoEditor.csproj -f net10.0-browserwasm -c Release -o publish/web
          ls publish/web/wwwroot | head -n 20

      - name: Zip site for the release
        run: |
          cd publish/web/wwwroot
          zip -r ../../../AiVideoEditor-web.zip . -x '*.map'

      - name: Upload site zip to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload latest AiVideoEditor-web.zip --clobber

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/web/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
